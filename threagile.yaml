individual_risk_categories:


risk_tracking:
  # --- SQL Injection: TypeORM + parámetros nombrados (back) ---
  sql-nosql-injection@api-nestjs@db-postgresql@api-nestjs>api-a-postgresql:
    status: mitigated
    justification: >
      Backend NestJS usa TypeORM Repository/QueryBuilder con parámetros nombrados
      (:idEleccion, etc.). El SQL crudo queda limitado a migraciones DDL estáticas.
      Evidencia: back/src (createQueryBuilder + TypeOrmModule).
    ticket: code-review-back
    date: 2026-09-07
    checked_by: Equipo Five Stack

  # --- XSS: React escaping + CSP nginx/Vite (front) + Helmet API (back) ---
  cross-site-scripting@spa-bud:
    status: mitigated
    justification: >
      SPA React sin dangerouslySetInnerHTML; CSP production (script-src 'self') vía
      security-headers.ts + nginx (VOTAR-381). Residual: style-src 'unsafe-inline'.
    ticket: VOTAR-381
    date: 2026-09-07
    checked_by: Equipo Five Stack

  cross-site-scripting@spa-panel-admin:
    status: mitigated
    justification: >
      Misma SPA y mismas cabeceras CSP/XFO/nosniff que BUD (deploy nginx + Vite headers).
    ticket: VOTAR-381
    date: 2026-09-07
    checked_by: Equipo Five Stack

  # --- CSRF: SameSite=Lax + cookies HttpOnly + CORS whitelist ---
  cross-site-request-forgery@spa-bud@browser-usuario>carga-bud:
    status: accepted
    justification: >
      Cookies de sesión HttpOnly con sameSite=lax (back/src/auth/utils/auth-cookie.util.ts)
      y CORS con whitelist. No hay token CSRF dedicado; riesgo residual aceptado para
      el alcance académico/testnet.
    ticket: VOTAR-380
    date: 2026-09-07
    checked_by: Equipo Five Stack

  cross-site-request-forgery@spa-panel-admin@browser-usuario>carga-panel:
    status: accepted
    justification: >
      Igual que BUD: SameSite=Lax + CORS + 2FA admin (VOTAR-458) reduce impacto de CSRF
      sobre mutaciones administrativas.
    ticket: VOTAR-458
    date: 2026-09-07
    checked_by: Equipo Five Stack

  # --- Autenticación ---
  missing-authentication@spa-bud>bud-reveal-anonimo@spa-bud@api-nestjs:
    status: accepted
    justification: >
      Reveal anónimo (FASE 2) es intencional: EntidadFirmasPublicController sin JWT
      para desvinculación identidad↔voto (VOTAR-377/379). Rate limit aplicado.
    ticket: VOTAR-377
    date: 2026-09-07
    checked_by: Equipo Five Stack

  missing-authentication@spa-dashboard>dashboard-a-api@spa-dashboard@api-nestjs:
    status: accepted
    justification: >
      Dashboard Público: endpoints de lectura ciudadana sin autenticación por diseño
      (participacion-public, escrutinio-public).
    ticket: VOTAR-367
    date: 2026-09-07
    checked_by: Equipo Five Stack

  missing-authentication@browser-usuario>carga-bud@browser-usuario@spa-bud:
    status: accepted
    justification: >
      Carga estática de la SPA; la autenticación real es SSO votante vía BFF tras cargar la BUD.
    ticket: code-review-front
    date: 2026-09-07
    checked_by: Equipo Five Stack

  missing-authentication@browser-usuario>carga-panel@browser-usuario@spa-panel-admin:
    status: accepted
    justification: >
      Carga estática del Panel; autenticación nick/password + 2FA TOTP antes de cookies de sesión.
    ticket: VOTAR-458
    date: 2026-09-07
    checked_by: Equipo Five Stack

  # --- 2FA (VOTAR-458) ---
  missing-authentication-second-factor@browser-usuario>carga-panel@browser-usuario@spa-panel-admin:
    status: mitigated
    justification: >
      2FA TOTP obligatorio en Panel Admin (TotpService + /auth/2fa/* + UI admin-two-factor-form).
    ticket: VOTAR-458
    date: 2026-09-07
    checked_by: Equipo Five Stack

  missing-authentication-second-factor@spa-bud>*@*@*:
    status: accepted
    justification: >
      BUD usa SSO institucional UTN; 2FA aplica al Panel Admin, no al electorado.
    ticket: VOTAR-458
    date: 2026-09-07
    checked_by: Equipo Five Stack

  missing-authentication-second-factor@spa-dashboard>*@*@*:
    status: accepted
    justification: >
      Canal público de auditoría; sin 2FA por diseño.
    ticket: VOTAR-458
    date: 2026-09-07
    checked_by: Equipo Five Stack

  missing-authentication-second-factor@browser-usuario>carga-bud@browser-usuario@spa-bud:
    status: accepted
    justification: >
      Carga BUD + SSO votante; 2FA no aplica al flujo electoral ciudadano.
    ticket: VOTAR-458
    date: 2026-09-07
    checked_by: Equipo Five Stack

  # --- Propagación de identidad ---
  missing-identity-propagation@spa-bud>bud-a-api@spa-bud@api-nestjs:
    status: mitigated
    justification: >
      VoterJwtAuthGuard + RolesGuard + VoterElectionGuard; autorización con votanteHash/sub del JWT.
    ticket: code-review-back
    date: 2026-09-07
    checked_by: Equipo Five Stack

  missing-identity-propagation@spa-panel-admin>panel-a-api@spa-panel-admin@api-nestjs:
    status: mitigated
    justification: >
      @AdminAuth (JwtAuthGuard + RolesGuard ELECTION_ADMIN); mutaciones ligadas a user.sub.
    ticket: code-review-back
    date: 2026-09-07
    checked_by: Equipo Five Stack

  # --- Hardening ---
  missing-hardening@spa-bud:
    status: mitigated
    justification: >
      Cabeceras CSP/HSTS/XFO/Permissions-Policy en Vite+nginx (front) y Helmet en API (VOTAR-381).
    ticket: VOTAR-381
