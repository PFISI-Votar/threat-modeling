threagile_version: 1.0.0

title: VOTAR Threat Model

date: 2026-09-07

author:
  name: Equipo Five Stack – UTN FRVM
  homepage: https://github.com/PFISI-Votar


management_summary_comment: >
  VOTAR – Plataforma de Votación Electrónica con Tecnología Blockchain (UTN FRVM,
  Equipo Five Stack). Plataforma open source para comicios de pequeña y mediana
  escala (piloto CEUTI). Combina un backend off-chain (NestJS / PostgreSQL) con
  smart contracts en Ethereum Sepolia para verificabilidad E2E, inmutabilidad del
  escrutinio y desvinculación criptográfica identidad→voto (Ley 25.326).
  La BUD y el Panel Admin están <b>in-scope</b> (lógica custom crítica: claves efímeras,
  commit/reveal, TOTP/JWT). El Dashboard Público y el browser/OS del usuario quedan
  <b>out-of-scope</b> (visor de auditoría ciudadana / endpoint no controlado).

business_criticality: critical


business_overview:
  description: >
    VOTAR digitaliza procesos electorales institucionales garantizando seguridad criptográfica,
    transparencia on-chain, verificabilidad extremo a extremo y anonimato del votante mediante
    desvinculación identidad→sufragio. Política de re-voto: LAST_VOTE_WINS. Alcance académico
    limitado a testnet Sepolia; Mainnet y comicios estatales quedan fuera de alcance.
  images:


technical_overview:
  description: >
    Frontends React (BUD, Panel Admin, Dashboard Público). API NestJS 11 con TypeORM sobre
    PostgreSQL 16 (configuración, padrón hasheado, audit log; sin vínculo identidad→voto).
    Autenticación vía SSO Autogestión UTN (JWT en cookies HttpOnly; TOTP opcional para admin).
    Entidad de Firmas (commit autenticado / reveal anónimo). Emisión de voto desde la BUD con
    wallet efímera secp256k1 hacia Sepolia vía proveedores RPC. Contratos Solidity/OpenZeppelin
    (ElectionFactory, Ballot, VoteRegistry, MerkleRootStore, AccessControl).
  images:


questions:
  Cómo se custodian las claves VALIDATOR / PAUSER / deployer en el entorno de despliegue?: ""
  El RPC provider (Alchemy/Infura/QuickNode) está bajo SLA y controles contractuales adecuados?: ""
  Existe rotación y HSM/vault para secretos operativos del backend?: ""
  El reverse proxy de producción fuerza HTTPS y cabeceras alineadas a VOTAR-381?: ""
  El calldata publico de castSignedVote vincula voterLeaf con candidateIds - se planea mitigar con ZK proofs?: ""
  La wallet transmisora (VITE_PRIVATE_KEY) esta expuesta en el bundle del cliente - se planea migrar a Relayer backend?: ""
  El seed del wallet efimero en localStorage se planea cifrar o proteger?: ""
  Existe runbook documentado para re-deploy de emergencia via ElectionFactory?: ""
  Se evaluo Redis para rate limiting en caso de despliegue multi-replica?: ""


abuse_cases:
  Manipulación del padrón o de la raíz Merkle: >
    Como atacante quiero alterar el padrón hasheado o publicar una raíz Merkle fraudulenta
    para habilitar electores ilegítimos o excluir habilitados.
  Vinculación identidad-voto: >
    Como atacante o insider quiero correlacionar la identidad SSO con el sufragio on-chain
    para romper el secreto del voto (violación Ley 25.326).
  Robo o abuso de claves operativas: >
    Como atacante quiero exfiltrar VALIDATOR_PRIVATE_KEY, claves de deployer o pauser para
    firmar validaciones falsas, pausar comicios o desplegar contratos maliciosos.
  Compromiso de sesión admin: >
    Como atacante quiero secuestrar la sesión JWT/TOTP de una Autoridad Electoral para
    reconfigurar comicios, cargar padrones o publicar raíces on-chain.
  Manipulación del cliente de voto (BUD): >
    Como atacante quiero inyectar código (XSS/supply-chain del bundle) en la BUD para
    alterar la selección, filtrar claves efímeras o redirigir la transacción de voto.
  Doble voto o bypass de nullifier: >
    Como atacante quiero emitir sufragios múltiples no contemplados o evadir la unicidad
    criptográfica del VoteRegistry.
  Denegación de servicio electoral: >
    Como atacante quiero saturar API, RPC o contratos para impedir la emisión o el escrutinio
    durante la ventana del comicio.
  Falsificación de resultados públicos: >
    Como atacante quiero presentar escrutinio alterado (off-chain) respecto del estado canónico
    on-chain para dañar la confianza ciudadana.
  Extraccion de clave transmisora del bundle cliente: >-
    Como atacante quiero extraer VITE_PRIVATE_KEY del bundle JavaScript de la BUD
    compilado por Vite para drenar el gas de la wallet transmisora y causar DoS
    total del sistema de votación (hallazgo: constants.ts del frontend).
  Vinculacion identidad-voto via localStorage: >-
    Como atacante con acceso al dispositivo del votante quiero leer el seed
    almacenado en localStorage (votar:vote-seed) para derivar la clave efímera
    y el nullifier, vinculando la identidad SSO con el voto on-chain.
  Censura selectiva de votantes via Merkle proof: >-
    Como backend comprometido quiero servir Merkle proofs inválidos a votantes
    específicos para censurarlos, dado que la BUD no verifica el proof contra
    la raíz on-chain antes de transmitir.
  Vinculacion identidad-voto via calldata publica: >-
    Como observador pasivo de la blockchain quiero analizar el calldata de
    castSignedVote para correlacionar voterLeaf con candidateIds y romper
    el anonimato del voto.
  Compromiso de VALIDATOR_PRIVATE_KEY: >-
    Como atacante quiero comprometer la clave del VALIDATOR_ROLE custodiada
    por el backend para generar certificados de validación EIP-712 fraudulentos
    que habiliten votos sin Merkle proof legítimo.
  Exfiltracion de PII del padron via sessionStorage: >-
    Como atacante con XSS o acceso al dispositivo quiero leer sessionStorage
    (padron-preview) para obtener DNI y email de votantes durante la importación
    CSV del padrón (violación Ley 25.326).
  Bypass de rate limiting en despliegue horizontal: >-
    Como atacante quiero explotar que el rate limiter del backend es in-memory
    y en despliegue multi-réplica los límites se multiplican por instancia.
  Explotacion de ventana de re-voto: >-
    Como atacante quiero explotar minIntervalSeconds insuficiente o maxVotesPerVoter
    para forzar re-votación masiva automatizada.
  Manipulacion del RPC Failover: >-
    Como atacante quiero comprometer o saturar los proveedores RPC para forzar
    el fallback a un nodo malicioso que altere lecturas de estado on-chain.


security_requirements:
  Desvinculación identidad-voto: Ningún almacén off-chain debe persistir el vínculo entre identidad institucional y selección de voto (Ley 25.326).
  Verificabilidad E2E: Cada votante debe poder verificar que su sufragio fue contabilizado sin revelar su elección.
  Autenticación admin reforzada: Acceso de Autoridad Electoral con JWT HttpOnly y TOTP (2FA) donde aplique.
  Integridad del padrón: Raíz Merkle publicada on-chain antes de abrir el comicio; padrón sellado en estado OPEN.
  Hardening web: Cabeceras de seguridad (CSP, HSTS, etc.) en interfaces expuestas (VOTAR-381).
  Secretos operativos: Claves de cadena y JWT material nunca en el frontend; custodia en backend/ops.
  LAST_VOTE_WINS: La política de re-voto debe aplicarse de forma consistente off-chain y on-chain.
  Clave transmisora fuera del cliente: La wallet que paga gas (VITE_PRIVATE_KEY) no debe exponerse en el bundle JavaScript. Implementar Relayer backend o EIP-4337.
  Proteccion del seed efimero: El seed del wallet efímero en localStorage debe cifrarse con clave derivada de la sesión del usuario.
  Proteccion de calldata on-chain: Mientras no se implemente ZK-SNARKs o cifrado de boleta, el riesgo de vinculación identidad-voto vía blockchain explorer está presente.
  Custodia HSM de claves operativas: VALIDATOR_PRIVATE_KEY y PRIVATE_KEY deben custodiarse en HSM o Cloud KMS, no en variables de entorno.
  Verificacion local de Merkle proof: La BUD debe verificar el Merkle proof contra la raíz on-chain publicada antes de transmitir.
  Plan de contingencia contractual: Los contratos son no-upgradeables. Debe existir un runbook operativo para re-deploy de emergencia vía ElectionFactory.
  Rate limiter centralizado: En despliegues multi-réplica el rate limiter in-memory debe reemplazarse por Redis.
  PII fuera de sessionStorage: La previsualización del padrón CSV no debe serializar datos personales sin hashear en sessionStorage.


