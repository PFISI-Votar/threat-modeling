name: Threat Model Pages

on:
  push:
    branches:
      - master
    paths:
      - threagile.yaml
      - threagile-config.yaml
      - pkg/report/**
      - report/template/**
      - .github/workflows/threat-model-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Graphviz and PDF tools
        run: sudo apt-get update && sudo apt-get install -y graphviz poppler-utils

      - name: Build Threagile (local Spanish/compact report)
        run: go build -o bin/threagile ./cmd/threagile

      - name: Analyze threat model
        run: |
          mkdir -p dist tmp
          ./bin/threagile analyze-model \
            --config threagile-config.yaml \
            --model threagile.yaml \
            --output dist \
            --app-dir . \
            --temp-dir tmp \
            --background report/template/background.pdf \
            --skip-report-adoc \
            --ignore-orphaned-risk-tracking

      - name: Write GitHub Pages index
        run: |
          cat > dist/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="es">
          <head>
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1" />
            <title>VOTAR – Modelo de Amenazas (Threagile)</title>
            <style>
              :root {
                --bg: #f4f6f8;
                --ink: #1a1f24;
                --muted: #5a6570;
                --accent: #0b3d2e;
                --line: #d5dde3;
              }
              * { box-sizing: border-box; }
              body {
                margin: 0;
                font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
                color: var(--ink);
                background:
                  radial-gradient(1200px 500px at 10% -10%, #d9ebe3 0%, transparent 55%),
                  radial-gradient(900px 400px at 100% 0%, #e7eef5 0%, transparent 50%),
                  var(--bg);
                line-height: 1.5;
              }
              main {
                max-width: 960px;
                margin: 0 auto;
                padding: 3rem 1.25rem 4rem;
              }
              h1 {
                font-size: clamp(1.8rem, 4vw, 2.6rem);
                letter-spacing: -0.02em;
                margin: 0 0 0.35rem;
                color: var(--accent);
              }
              .lead {
                color: var(--muted);
                font-size: 1.05rem;
                max-width: 42rem;
                margin-bottom: 1.75rem;
              }
              .actions {
                display: flex;
                flex-wrap: wrap;
                gap: 0.75rem;
                margin-bottom: 2.5rem;
              }
              a.btn {
                display: inline-block;
                padding: 0.65rem 1rem;
                border: 1px solid var(--accent);
                background: var(--accent);
                color: #fff;
                text-decoration: none;
                font-family: ui-sans-serif, system-ui, sans-serif;
                font-size: 0.95rem;
              }
              a.btn.secondary {
                background: transparent;
                color: var(--accent);
              }
              section {
                margin-bottom: 2.5rem;
              }
              h2 {
                font-size: 1.25rem;
                margin: 0 0 0.75rem;
                border-bottom: 1px solid var(--line);
                padding-bottom: 0.35rem;
              }
              figure {
                margin: 0 0 1.5rem;
                background: #fff;
                border: 1px solid var(--line);
                padding: 0.75rem;
              }
              img {
                display: block;
                max-width: 100%;
                height: auto;
              }
              figcaption {
                font-family: ui-sans-serif, system-ui, sans-serif;
                font-size: 0.85rem;
                color: var(--muted);
                margin-top: 0.5rem;
              }
              .legend {
                background: #fff;
                border: 1px solid var(--line);
                padding: 0.85rem 1rem 0.35rem;
                margin: -0.5rem 0 1.5rem;
                font-family: ui-sans-serif, system-ui, sans-serif;
                font-size: 0.9rem;
              }
              .legend h3 {
                margin: 0 0 0.5rem;
                font-size: 0.95rem;
                color: var(--accent);
              }
              .legend ul {
                margin: 0 0 0.75rem;
              }
              ul {
                font-family: ui-sans-serif, system-ui, sans-serif;
                padding-left: 1.2rem;
              }
              footer {
                margin-top: 3rem;
                color: var(--muted);
                font-family: ui-sans-serif, system-ui, sans-serif;
                font-size: 0.85rem;
              }
            </style>
          </head>
          <body>
            <main>
              <h1>VOTAR – Modelo de Amenazas</h1>
              <p class="lead">
                Modelado de amenazas generado con Threagile para la plataforma de votación
                electrónica VOTAR (Equipo Five Stack – UTN FRVM).
              </p>
              <div class="actions">
                <a class="btn" href="report.pdf">Descargar report.pdf</a>
                <a class="btn secondary" href="risks.json">risks.json</a>
                <a class="btn secondary" href="risks.xlsx">risks.xlsx</a>
                <a class="btn secondary" href="technical-assets.json">technical-assets.json</a>
                <a class="btn secondary" href="stats.json">stats.json</a>
                <a class="btn secondary" href="tags.xlsx">tags.xlsx</a>
              </div>

              <section>
                <h2>Diagrama de flujo de datos</h2>
                <figure>
                  <img src="data-flow-diagram.png" alt="Diagrama de flujo de datos VOTAR" />
                  <figcaption>data-flow-diagram.png</figcaption>
                </figure>
                <div class="legend">
                  <h3>Leyenda</h3>
                  <ul>
                    <li><strong>Formas:</strong> caja = entidad externa; elipse = proceso; cilindro = almacén de datos; octágono = usado como cliente.</li>
                    <li><strong>Relleno:</strong> azul claro = Internet; gris claro = fuera de alcance; verde/cian = desarrollo a medida.</li>
                    <li><strong>Título:</strong> rojo = mission-critical; ámbar = critical; negro = importante/otros.</li>
                    <li><strong>Líneas:</strong> sólida = tráfico de negocio; discontinua = DevOps; punteada/rosa = sin datos o protocolo desconocido.</li>
                    <li><strong>Color de enlace:</strong> rojo = strictly-confidential; ámbar = confidential; azul oscuro = VPN; marrón = IP filtrada.</li>
                    <li><strong>RAA %:</strong> atractivo relativo para el atacante calculado por Threagile.</li>
                  </ul>
                </div>
              </section>

              <section>
                <h2>Diagrama de activos de datos</h2>
                <figure>
                  <img src="data-asset-diagram.png" alt="Diagrama de activos de datos VOTAR" />
                  <figcaption>data-asset-diagram.png</figcaption>
                </figure>
                <div class="legend">
                  <h3>Leyenda</h3>
                  <ul>
                    <li><strong>Nodos de datos (izquierda):</strong> el color indica probabilidad de brecha (rojo/alto, ámbar/medio, verde/bajo, gris/sin potencial).</li>
                    <li><strong>Activos técnicos (derecha):</strong> el color indica la severidad de riesgo más alta aún abierta.</li>
                    <li><strong>Línea azul sólida:</strong> el activo técnico <em>almacena</em> ese dato.</li>
                    <li><strong>Línea gris discontinua:</strong> el activo técnico <em>procesa</em> ese dato (sin almacenarlo).</li>
                  </ul>
                </div>
              </section>

              <section>
                <h2>Artefactos</h2>
                <ul>
                  <li><a href="report.pdf">report.pdf</a> — informe completo (español, versión condensada)</li>
                  <li><a href="risks.json">risks.json</a> / <a href="risks.xlsx">risks.xlsx</a></li>
                  <li><a href="technical-assets.json">technical-assets.json</a></li>
                  <li><a href="stats.json">stats.json</a> / <a href="tags.xlsx">tags.xlsx</a></li>
                </ul>
              </section>

              <footer>
                Generado automáticamente desde <code>threagile.yaml</code> con el Threagile
                modificado de este repositorio (vía GitHub Actions).
              </footer>
            </main>
          </body>
          </html>
          EOF

      - name: Verify condensed Spanish PDF
        run: |
          test -f dist/report.pdf
          pages="$(pdfinfo dist/report.pdf | awk '/^Pages:/{print $2}')"
          echo "PDF pages: $pages"
          if [ "$pages" -gt 50 ]; then
            echo "PDF too long ($pages pages); expected <= 50"
            exit 1
          fi
          pdftotext dist/report.pdf - | head -20 | tee /tmp/pdf-head.txt
          grep -q "Reporte de Modelo de Amenazas" /tmp/pdf-head.txt
          grep -q "Resumen Ejecutivo\|Índice\|Indice" /tmp/pdf-head.txt || true

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
